<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super Francotron 3000</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header>
      <h1>Super Francotron 3000</h1>
      <p>Synthèse vocale locale en français (Piper TTS)</p>
    </header>

    <section class="card">
      <h2>Nouveau Texte</h2>
      <form id="form-texto">
        <textarea id="texto-input" rows="4" placeholder="Écrivez ou collez votre texte ici..." required></textarea>
        <button type="submit" id="btn-salvar">Ajouter à la bibliothèque</button>
      </form>
    </section>

    <section class="card">
      <div class="card-header">
        <h2>Bibliothèque de Textes</h2>
        <button id="btn-atualizar" class="btn-secundario">Rafraîchir</button>
      </div>

      <div id="status-player" class="player-container">
        <span id="player-label">Sélectionnez un texte ci-dessous :</span>
        <audio id="audio-player" controls preload="none"></audio>
      </div>

      <ul id="lista-textos" class="lista"></ul>
    </section>
  </main>

  <dialog id="modal-confirmacao" class="modal-dialog">
    <div class="modal-conteudo">
      <div class="modal-icone">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 6h18"></path>
          <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
          <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
          <line x1="10" y1="11" x2="10" y2="17"></line>
          <line x1="14" y1="11" x2="14" y2="17"></line>
        </svg>
      </div>
      <h3>Confirmer la suppression</h3>
      <p id="modal-mensagem">Êtes-vous sûr de vouloir supprimer cet élément ? Cette action efface définitivement le fichier audio associé.</p>
      <div class="modal-acoes">
        <button type="button" id="btn-modal-cancelar" class="btn-secundario">Annuler</button>
        <button type="button" id="btn-modal-confirmar" class="btn-danger">Supprimer</button>
      </div>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
